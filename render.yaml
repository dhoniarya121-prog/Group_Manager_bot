services:
  - type: web
    name: telegram-group-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python group_manager_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
